[project]
name = "tarragon"
version = "0.1.0"
description = "Tarragon - FastAPI app for MakerWorld integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.32",
    "trimesh>=4.12.2",
    "pytest-httpx>=0.36.2",
    "curl-cffi>=0.15.0",
]

[project.scripts]
tarragon = "tarragon.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
